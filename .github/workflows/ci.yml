name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm lint
      - name: ESLint
        run: pnpm exec eslint . --quiet

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate JWT secret
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
      - name: Unit tests
        run: pnpm test:unit

  new-migrations:
    name: New migrations
    # Vercel builds do not migrate production. A migration that merges without being applied there breaks the live site.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Warn about migrations that still need to be applied to production
        shell: bash
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          migrations="$(node scripts/operations/new-migrations.mjs "$BASE_REF")"
          if [ -z "$migrations" ]; then
            echo "No new migrations."
            exit 0
          fi
          {
            echo "### New migrations: apply them to production"
            echo
            echo "Vercel builds never migrate production. This change adds:"
            echo
            while IFS= read -r name; do echo "- \`$name\`"; done <<< "$migrations"
            echo
            echo "Apply them to the production database around the merge:"
            echo
            echo '```'
            echo 'pnpm exec prisma migrate deploy   # with the production DIRECT_URL'
            echo '```'
            echo
            echo "The production build checks this and fails until they are applied, so the live site keeps serving the previous deployment."
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r name; do
            echo "::warning title=New migration::$name must be applied to the production database (pnpm exec prisma migrate deploy)."
          done <<< "$migrations"

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miracle_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miracle_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # A throwaway database inside this job. It never touches Neon or any shared database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miracle_schema
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/miracle_schema
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database
        run: pnpm exec prisma migrate deploy
      - name: Fail when prisma/schema.prisma and the migrations disagree
        # Exit code 2 means the datamodel needs a database change that no migration provides.
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script --exit-code
      - name: Record the physical catalog built from the migrations (PostgreSQL 18)
        # The post-migration check compares production against this file; it is only a reference, never a gate.
        env:
          CATALOG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miracle_schema
        run: node scripts/operations/catalog-postcheck.mjs snapshot catalog-reference-pg18.json
      - uses: actions/upload-artifact@v5
        with:
          name: catalog-reference-pg18
          path: catalog-reference-pg18.json
          retention-days: 30
      - name: Solo registration against the migrated database
        # Slot counting, the queue and the race for the last slot need real transactions. This runs after the
        # catalog snapshot so its test rows can never end up in the reference. The tests clean up after themselves.
        env:
          SOLO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miracle_schema
        run: pnpm exec vitest run src/lib/solo/registration-repository.integration.test.ts

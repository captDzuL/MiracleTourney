name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm lint
      - name: ESLint
        run: pnpm exec eslint . --quiet

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate JWT secret
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
      - name: Unit tests
        run: pnpm test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: [lint-and-typecheck, unit-tests]
    concurrency:
      group: e2e-neon-test-db
      cancel-in-progress: false
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      CI: true
      E2E_ENV_FILE: ${{ github.workspace }}/.env.test
      PLAYWRIGHT_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create isolated E2E environment
        shell: bash
        env:
          TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          TEST_DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
          PRODUCTION_NEON_HOST: ${{ secrets.NEON_PROD_HOST }}
        run: |
          umask 077
          for value in "$TEST_DATABASE_URL" "$TEST_DIRECT_URL" "$PRODUCTION_NEON_HOST"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done
          {
            printf 'DATABASE_URL=%s\n' "$TEST_DATABASE_URL"
            printf 'DIRECT_URL=%s\n' "$TEST_DIRECT_URL"
            printf 'NEON_PROD_HOST=%s\n' "$PRODUCTION_NEON_HOST"
            printf 'E2E_DATABASE_RESET_ALLOWED=true\n'
          } > .env.test
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright browsers
        run: pnpm exec playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Generate JWT secret
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
      - name: Run guarded Match Day, default, and flags-off E2E profiles
        run: pnpm test:e2e:ci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm lint
      - name: ESLint
        run: pnpm exec eslint . --quiet

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate JWT secret
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
      - name: Unit tests
        run: pnpm test:unit

  schema-drift:
    name: Schema drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miracle_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miracle_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # A throwaway database inside this job. It never touches Neon or any shared database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miracle_schema
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/miracle_schema
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database
        run: pnpm exec prisma migrate deploy
      - name: Fail when prisma/schema.prisma and the migrations disagree
        # Exit code 2 means the datamodel needs a database change that no migration provides.
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script --exit-code

name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: ESLint
        run: pnpm exec next lint --quiet || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT secret
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Unit tests
        run: pnpm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests]
    # Only run E2E when the Neon test branch secrets are available
    # (skipped on forks and dependabot PRs that lack access to secrets)
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      NEON_PROD_HOST: ${{ secrets.NEON_PROD_HOST }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Generate JWT secret
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -base64 32)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Wake Neon test branch
        shell: bash
        run: |
          echo "Attempting to wake Neon compute (up to 5 attempts)..."
          for i in 1 2 3 4 5; do
            node -e "
              const net = require('net');
              const url = new URL(process.env.DATABASE_URL.replace('postgresql://', 'http://'));
              const sock = net.connect(5432, url.hostname, () => { sock.destroy(); process.exit(0); });
              sock.on('error', () => process.exit(1));
              setTimeout(() => { sock.destroy(); process.exit(1); }, 8000);
            " && echo "Neon is awake!" && break
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          echo "Wake attempts done, proceeding."

      - name: Verify test DB (not production)
        run: pnpm test:e2e:preflight

      - name: Run migrations on test DB
        run: pnpm prisma migrate deploy

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_PORT: "3100"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

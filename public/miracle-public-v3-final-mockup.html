<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09111e">
  <title>Miracle — Public V3 Final Mockup</title>
  <link rel="icon" href="logo/miracle-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="mockup-public-v3/styles.css">
  <style>
    .section-intro{font-size:11px;margin:-8px 0 18px}
    .event-list-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .event-list-card{display:grid;grid-template-columns:42% 58%;min-height:210px;padding:0;text-align:left;color:var(--text);border:1px solid var(--border);border-radius:11px;background:var(--surface);overflow:hidden;width:100%}
    .event-list-card:hover{border-color:var(--violet);background:var(--selected)}
    .event-card-art{position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:18px;background:radial-gradient(circle at 70% 20%,#49d1ec35,transparent 42%),linear-gradient(145deg,#102a3f,var(--inset))}
    .event-card-art.violet{background:radial-gradient(circle at 70% 20%,#aa8bff38,transparent 42%),linear-gradient(145deg,#25203c,var(--inset))}
    .event-card-art.cream{background:radial-gradient(circle at 70% 20%,#f6dfb130,transparent 42%),linear-gradient(145deg,#302c23,var(--inset))}
    .event-card-art>b{position:absolute;right:-5px;top:-18px;font-size:112px;line-height:1;color:#ffffff0c;letter-spacing:-.1em}
    .event-card-art span{position:relative;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .event-card-art strong{position:relative;font-size:15px;line-height:1.2;margin-top:8px}
    .event-card-copy{display:flex;flex-direction:column;align-items:flex-start;padding:18px;min-width:0}
    .event-card-copy>strong{font-size:13px;line-height:1.35;margin:15px 0 5px}
    .event-card-copy>span:not(.badge),.event-card-copy small{font-size:9px;color:var(--muted)}
    .event-card-copy small{margin-top:4px}
    .event-card-copy i{font-size:10px;color:var(--cyan);font-style:normal;margin-top:auto;padding-top:15px;font-weight:600}
    .directory-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
    .directory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .directory-grid .event-list-card{min-height:245px}
    .directory-grid .event-card-art strong{font-size:19px}
    .awards-heading{align-items:flex-start}.awards-heading p{font-size:9px;margin-top:5px}.award-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px}.award-card{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;min-width:0;padding:13px;border:1px solid var(--border);border-radius:9px;background:var(--inset)}.award-avatar{width:40px;height:44px;display:grid;place-items:center;border:1px solid var(--border);border-radius:8px;background:linear-gradient(145deg,#18273b,#0d1725);color:var(--cyan);font-size:9px;font-weight:800}.award-card b{display:block;font-size:11px}.award-card div>span,.award-card div>small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.award-certificate-link{min-height:44px;padding:7px 9px;border:0;background:transparent;color:var(--cyan);font-size:9px;font-weight:600;white-space:nowrap}.award-certificate-link:hover{text-decoration:underline}
    @media(max-width:800px){.event-list-grid{grid-template-columns:1fr 1fr}.event-list-grid .event-list-card:last-child{grid-column:1/-1}.directory-grid .event-list-card:last-child{grid-column:auto}.event-list-card{grid-template-columns:39% 61%;min-height:195px}}
    @media(max-width:580px){.event-list-grid,.directory-grid{grid-template-columns:1fr}.event-list-grid .event-list-card:last-child,.directory-grid .event-list-card:last-child{grid-column:auto}.event-list-card,.directory-grid .event-list-card{min-height:175px;grid-template-columns:40% 60%}.event-card-art,.event-card-copy{padding:14px}.event-card-art strong{font-size:13px}.directory-grid .event-card-art strong{font-size:14px}.directory-toolbar{align-items:flex-start;flex-direction:column}.directory-toolbar .segmented{width:100%;flex-wrap:nowrap;overflow-x:auto}.directory-toolbar .segmented button{flex:0 0 auto}.awards-heading{display:grid}.awards-heading .button{margin-top:12px}.award-grid{grid-template-columns:1fr;padding:12px}.award-card{grid-template-columns:44px minmax(0,1fr);padding:12px}.award-certificate-link{grid-column:2;justify-self:start;padding:5px 0;min-height:36px}.award-avatar{width:38px;height:42px}}
  </style>
  <style>@media(max-width:580px){.header-inner{gap:10px}.brand,.brand img{width:96px}.global-nav{gap:10px}.global-nav a{white-space:nowrap;font-size:9px}}</style>
  <script defer src="mockup-public-v3/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Lewati ke konten</a>
  <div class="studio" aria-label="Kontrol mockup">
    <div class="studio-title"><span class="studio-dot"></span> PUBLIC V3 <span class="muted">/ FINAL EXPLORATION</span></div>
    <div class="phase-controls" role="group" aria-label="Simulasi fase event">
      <span class="muted">Simulasi fase</span>
      <button data-phase="registration">Registrasi</button>
      <button data-phase="drawing">Drawing terbit</button>
      <button data-phase="live">Berlangsung</button>
      <button data-phase="finished">Selesai</button>
    </div>
    <span class="sample-label">Data contoh · bukan event live</span>
  </div>
  <header class="global-header"><div class="wrap header-inner">
    <a data-page="home" class="brand" aria-label="Miracle, beranda"><img src="logo/miracle-horizontal.svg" alt="Miracle"></a>
    <nav class="global-nav" aria-label="Navigasi utama"><a data-page="home">Beranda</a><a data-page="event">Event utama <span class="nav-dot"></span></a><a data-page="events">Semua event</a></nav>
    <div class="header-end"><span class="edition">COMMUNITY COMPETITION</span><button class="button small" data-dialog="login">Masuk <span aria-hidden="true">↗</span></button></div>
  </div></header>
  <main id="main" tabindex="-1"></main>
  <footer class="wrap footer"><a data-page="home" aria-label="Miracle, beranda"><img src="logo/miracle-horizontal.svg" alt="Miracle"></a><p>Kompetisi komunitas. Cerita yang layak diikuti.</p><span>Copyright © Miracle · 2026</span></footer>
  <dialog id="detail-dialog"><div class="dialog-head"><span class="eyebrow">MIRACLE / EVENT CENTER</span><button class="icon-button" id="close-dialog" aria-label="Tutup dialog">✕</button></div><div id="dialog-body"></div></dialog>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
